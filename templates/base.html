<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" 
          content="Brian Redfern, Universal Life Minister, Divination Expert, Poet and Composer" 
        />
        <link rel="shortcut icon" href="/favicon.ico" />
        <title>Brian Redfern Tarot, Poetry, Creative Non fiction and Web Development Blog.</title>
        <link rel="stylesheet" type="text/css" rel="preload" as="style" href="/site.css" onload="this.onload=null;this.rel='stylesheet'">
    </head>
    <body>
        <section>
            <header>
                <h1><a href="/">Brian Redfern</a></h1>
            </header>
            <nav>
              <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/blog/">Blog</a></li>
                <li><a href="https://github.com/bredfern">Github</a></li>
                <li><a href="https://fraterbrian.bandcamp.com/">Bandcamp</a></li>
              </ul>
            </nav>
            <main>
              {% block content %} {% endblock %}
            </main>
            <aside> 
              <form action="https://formsubmit.co/brianwredfern@gmail.com" method="POST">
                <fieldset>
                  <legend><h2>Get a Tarot Reading</h2></legend>
                  <label for="name">Name <input type="text" name="name" /></label>
                  <label for="email">Email <input type="email" name="email" /></label>
                  <div><input type="submit"></div>
                </fieldset>
              </form>
            </aside>
            <footer>&#169; 2026 Brian Redfern</footer>
        </section>
    </body>
</html>
