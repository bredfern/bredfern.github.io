<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" 
          content="Brian Redfern, Universal Life Minister, Divination Expert, Poet and Composer" 
        />
        <link rel="shortcut icon" href="/favicon.ico" />
        <title>Brian Redfern Divination and Web Development Blog.</title>
        <link rel="stylesheet" type="text/css" rel="preload" as="style" href="/site.css">
    </head>
    <body>
        <div class="container">
            <header>
                <h1><a href="/" id="heading">Brian Redfern</a></h1>
            </header>
            <nav>
                <div>
                  <audio-playlist-player playlist='[
                "gamelans.mp3",
                "trydented.mp3",
		            "bushcrack.mp3"
              ]'>
            </audio-playlist-player>
            </div> 
            </nav>
            <main>
                <div class="centered">
                  <a href="/"><img src="/me.webp" width="368" height="317" id="logo" alt="Frater Brian"/></a>
                </div>
                <div class="blog-sections centered">
                  <a href="/blog/poems">Poetry</a>  
                  <a href="/blog/diary">Diary</a>
                  <a href="/blog/stories">Stories</a>
                  <a href="/blog/songs">Songs</a>
                </div>
                <hr>
                <div>{% block content %} {% endblock %}</div>
            </main>
            <aside class="aside-content">
              <h3 class="centered">Get a Reading</h3>
              <form action="https://formsubmit.co/your@email.com" method="POST" />
                <p><label>Name <input type="text" name="name" /></label></p>
                <p><label>Email <input type="email" name="email" /></label></p>
                <p><button type="submit">submit</button></p>
              </form>
            </aside>
            <footer class="centered">&#169; 2026 Brian Redfern</footer>
        </div>
    </body>
  <script src="player.js" defer></script>
</html>
