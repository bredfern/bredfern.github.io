name: Build Zola site for GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Zola version
        shell: bash
        run: |
          set -euo pipefail
          v="v0.22.0" # Set your version here
          if [[ ! "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
            echo "Invalid zola_version: '$v' (expected e.g. v0.22.0)" >&2
            exit 1
          fi

      - name: Build site with Zola
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/getzola/zola:v0.22.0"
          echo "Using image: $image"

          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -w "/workspace/." \
            "$image" build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public